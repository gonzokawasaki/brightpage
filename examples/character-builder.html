<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Builder</title>
<style id="bp-style">:root{--bg:#f6f4ee;--card:#fff;--ink:#1f2328;--muted:#5d646d;--line:#dcd8cc;--accent:#e8590c;--accent-ink:#fff;--soft:#fff4e6;--ok:#2b8a3e;--ok-soft:#e6f6ea;--bad:#c92a2a;--bad-soft:#fdecec;--focus:#1971c2;--shadow:0 2px 10px rgba(0,0,0,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#22242a;--ink:#ececec;--muted:#a3a8b0;--line:#3a3d45;--accent:#ff8a3d;--accent-ink:#1b1b1b;--soft:#3a2a1c;--ok:#69db7c;--ok-soft:#1f3326;--bad:#ff8787;--bad-soft:#3b2020;--focus:#74c0fc;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--card:#22242a;--ink:#ececec;--muted:#a3a8b0;--line:#3a3d45;--accent:#ff8a3d;--accent-ink:#1b1b1b;--soft:#3a2a1c;--ok:#69db7c;--ok-soft:#1f3326;--bad:#ff8787;--bad-soft:#3b2020;--focus:#74c0fc;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--focus)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{font-size:1.1rem;padding:12px 22px}
.btn.send{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.btn.small{min-height:36px;padding:4px 10px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.icon{min-width:36px;min-height:36px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
input[type=text],input[type=email],input[type=url],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:96px;resize:vertical}
label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:.95rem}
.hint{color:var(--muted);font-size:.9rem}
/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top .ttl{font-weight:700;flex:1;min-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{font-weight:800;color:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.prog .bar{width:120px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.tip{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-size:.95rem}
.tip span{flex:1}
/* editor */
.ed{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 62px)}
.thumbs{border-right:1px solid var(--line);padding:12px;overflow:auto;max-height:calc(100vh - 62px);position:sticky;top:62px}
.th{display:flex;gap:8px;align-items:flex-start;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px;cursor:pointer}
.th.on{border-color:var(--accent)}
.th .n{font-weight:700;color:var(--muted);min-width:20px}
.th .t{font-weight:600;font-size:.92rem;line-height:1.3}
.th .s{font-size:.8rem;color:var(--muted)}
.th .tools{display:flex;gap:4px;margin-top:6px}
.canvas{padding:20px 16px 80px;overflow:auto}
.bk{position:relative;border:1px dashed transparent;border-radius:12px;padding:4px;margin:0 -4px 8px}
.bk:hover,.bk:focus-within{border-color:var(--line)}
.bk .bt{display:flex;gap:4px;justify-content:flex-end;margin-bottom:2px}
.addblk{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.addblk select{max-width:260px}
.ptitle{font-size:1.4rem;font-weight:700;border:1px dashed var(--line);margin-bottom:12px}
/* page card */
.page{max-width:860px;margin:0 auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:28px 32px;min-height:420px}
.page>h2{margin:0 0 16px;font-size:1.6rem}
.player{padding:20px 16px 110px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-top:1px solid var(--line);z-index:5}
.nav .mid{color:var(--muted);font-size:.9rem;text-align:center}
/* blocks */
.b-heading{font-size:2rem;font-weight:800;line-height:1.2;margin:8px 0 12px}
.b-text p{margin:0 0 10px}
.b-text ul{margin:0 0 10px;padding-left:22px}
.b-callout{background:var(--soft);border-left:5px solid var(--accent);padding:12px 16px;border-radius:8px;margin:8px 0}
.b-callout p{margin:0 0 6px}
.b-steps ol{padding-left:24px;margin:6px 0}
.b-steps li{margin-bottom:6px}
.box{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;background:var(--card)}
.box h3{margin:0 0 8px;font-size:1.05rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:4px}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:8px 0}
.flip{min-height:110px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600}
.flip.back{background:var(--soft);border-color:var(--accent);font-weight:400;font-size:.95rem}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{text-align:left;min-height:44px;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--accent);background:var(--soft)}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.gap{display:inline-block;width:8em;min-height:auto;padding:2px 6px;margin:0 2px;border:0;border-bottom:2px solid var(--muted);border-radius:4px 4px 0 0;background:var(--soft)}
.gap.ok{border-color:var(--ok);background:var(--ok-soft)}
.gap.bad{border-color:var(--bad);background:var(--bad-soft)}
.gaptext{line-height:2.2}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:40px;padding:6px 14px;border-radius:20px;border:2px solid var(--line);background:var(--card)}
.chip.on{border-color:var(--accent);background:var(--soft);font-weight:700}
.wc{font-size:.85rem;color:var(--muted);margin-top:4px}
.photo img{max-width:100%;max-height:360px;border-radius:10px;display:block;margin:8px 0}
.done-tick{color:var(--ok);font-weight:700;margin-left:6px}
.check{display:flex;gap:10px;align-items:center;min-height:40px}
.check input{width:22px;height:22px}
/* dice */
.dice{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.dice .lab{font-size:1.15rem;font-weight:700}
.dice .desc{font-size:.88rem;color:var(--muted)}
.faces{display:flex;gap:6px;align-items:center}
.die{width:44px;height:44px;border-radius:10px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem;background:var(--card)}
.die.rolling{animation:wob .12s infinite alternate}
@keyframes wob{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.total{font-size:1.4rem;font-weight:800;min-width:2.2em;text-align:center}
.band{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:700;font-size:.85rem;background:var(--soft)}
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin:8px 0 0;padding:0;list-style:none;font-size:.95rem}
.dlist li{padding:4px 8px;border-radius:8px}
.dlist li.on{background:var(--soft);outline:2px solid var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){.die.rolling{animation:none}}
/* sheet */
.sheetwrap{overflow-x:auto;margin:8px 0}
table.sheet{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sheet th{background:var(--bg);color:var(--muted);font-weight:600;font-size:.85rem;padding:4px 8px;border:1px solid var(--line);min-width:32px}
table.sheet td{border:1px solid var(--line);padding:0;min-width:96px;height:36px}
table.sheet td .v{padding:6px 8px;white-space:nowrap}
table.sheet td input{border:0;border-radius:0;padding:6px 8px;width:100%;min-width:96px;background:var(--soft)}
table.sheet td.ok input{background:var(--ok-soft)}
table.sheet td.bad input{background:var(--bad-soft)}
.fbar{display:flex;gap:8px;align-items:center;font-family:ui-monospace,Menlo,monospace;font-size:.9rem;color:var(--muted);margin-top:6px}
/* own pages */
.own .tag{color:var(--focus)}
/* modal + toast */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--card);border-radius:16px;max-width:620px;width:100%;padding:22px 24px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 8px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;max-height:200px;overflow:auto;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:30;font-weight:600;max-width:90vw}
.ok-list{list-style:none;padding:0}
.ok-list li{margin:6px 0}
/* start screen */
.start{max-width:760px;margin:0 auto;padding:48px 16px}
.start h1{font-size:2.6rem;margin:0;color:var(--accent)}
.start .lead{font-size:1.2rem;margin:8px 0 24px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.demos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.demo{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--card)}
.demo b{display:block;margin-bottom:4px}
.unknown{background:var(--bg);color:var(--muted);padding:12px;border-radius:8px}
@media (max-width:760px){
 .ed{grid-template-columns:1fr}
 .thumbs{position:static;max-height:none;display:flex;gap:8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
 .th{min-width:180px;margin:0}
 .page{padding:20px 16px}
 .b-heading{font-size:1.6rem}
 .prog .bar{width:70px}
 .dice{grid-template-columns:1fr}
}
</style>
</head>

    else if (k === 'text') n.textContent = v;
    else if (k === 'value') n.value = v;

}
function words(s) { return String(s || '').trim().split(/\s+/).filter(Boolean).length; }
function uid(p) { return p + Math.random().toString(36).slice(2, 8); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

  d.pages = Array.isArray(d.pages) ? d.pages : [];

    p.title = p.title || ''; p.blocks = Array.isArray(p.blocks) ? p.blocks : [];

/* ---------- editor (teacher) ---------- */
function snapshot() { undo.push(JSON.stringify(teacherCopy())); if (undo.length > 60) undo.shift(); dirty = true; }

const BLOCK_NAMES = { heading: 'Heading', text: 'Text', callout: 'Key point box', steps: 'Steps', flip: 'Flip cards', mcq: 'Quiz question', gapfill: 'Fill the gaps', task: 'Student task', dice: 'Dice roll', sheet: 'Mini spreadsheet' };

  sheet: [['title', 'Title', 'line'], ['cols', 'Columns', 'num'], ['rows', 'Rows', 'num'], ['cells', 'Cells (one per line, e.g. A1 = Item  or  B2 = 1.5  or  D5 = =SUM(D2:D4))', 'cells'], ['inputs', 'Cells students fill in (e.g. D2, D3)', 'csv'], ['checks', 'Answers (one per line, e.g. D2 = 3 formula)', 'checks'], ['hint', 'Hint', 'area']]

const ENC = {

const DEC = {
  line: v => v, area: v => v, num: v => (v === '' ? undefined : Number(v)), bool: v => v, select: v => v,
  lines: v => v.split('\n').map(x => x.trim()).filter(Boolean), index: v => Math.max(0, Number(v) - 1), csv: v => v.split(/[,\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean),
  pairs: v => v.split('\n').filter(x => x.trim()).map(x => { const [f, ...b] = x.split('|'); return { front: f.trim(), back: b.join('|').trim() }; }),
  cells: v => { const o = {}; v.split('\n').forEach(x => { const m = x.match(/^\s*([A-Za-z]\d+)\s*=\s?(.*)$/); if (m) o[m[1].toUpperCase()] = m[2].trim(); }); return o; },
  checks: v => v.split('\n').map(x => x.match(/^\s*([A-Za-z]\d+)\s*=\s*(-?[\d.]+)\s*(formula)?/i)).filter(Boolean).map(m => ({ cell: m[1].toUpperCase(), value: Number(m[2]), formula: !!m[3] }))

function editBlock(b) {

  modal('Edit: ' + (BLOCK_NAMES[b.type] || b.type), body, [{ label: 'Cancel' }, { label: 'Save', primary: true, onclick: () => {

}
function renderEditor() {
  const p = doc.pages[cur] || doc.pages[0];

    el('span', { class: 'logo' }, 'Brightpage'),
    el('div', { class: 'ttl', text: doc.title + (dirty ? '  •' : '') }),
    el('button', { class: 'btn small', onclick: doUndo, title: 'Undo (Ctrl+Z)' }, '↶ Undo'),
    el('button', { class: 'btn small', onclick: openSettings }, '⚙ Settings'),
    el('button', { class: 'btn small', onclick: openAI }, '✨ Edit with AI'),
    el('button', { class: 'btn small', onclick: () => { preview = {}; view = 'present'; render(); } }, '▶ Preview'),
    el('button', { class: 'btn small', onclick: saveTeacher }, '💾 Save'),
    el('button', { class: 'btn small primary', onclick: deploy }, 'Send out to students')));
  if (!sessionStorageGet('bp-tip')) app.append(el('div', { class: 'tip' },
    el('span', null, el('b', null, 'Tip: '), 'the quickest way to build or change a lesson is with an AI. Click ', el('b', null, '✨ Edit with AI'), '. Use the boxes below for small fixes.'),
    el('button', { class: 'btn small', onclick: e => { sessionStorageSet('bp-tip', '1'); e.target.parentNode.remove(); } }, 'Got it')));
  const thumbs = el('aside', { class: 'thumbs', 'aria-label': 'Pages' }, doc.pages.map((pg, i) => {
    const firstText = (pg.blocks.find(b => b.text || b.prompt || b.question || b.label) || {});
    const name = pg.title || firstText.text || firstText.label || 'Page ' + (i + 1);
    const kinds = [...new Set(pg.blocks.map(b => BLOCK_NAMES[b.type] || b.type))].slice(0, 3).join(' · ');
    return el('div', { class: 'th' + (i === cur ? ' on' : ''), tabindex: 0, onclick: () => { cur = i; render(); }, onkeydown: e => { if (e.key === 'Enter') { cur = i; render(); } } },
      el('span', { class: 'n', text: i + 1 }),
      el('div', null, el('div', { class: 't', text: String(name).slice(0, 60) }), el('div', { class: 's', text: kinds }),
        i === cur ? el('div', { class: 'tools' },
          el('button', { class: 'icon', title: 'Move up', 'aria-label': 'Move page up', disabled: i === 0, onclick: e => { e.stopPropagation(); change(() => { doc.pages.splice(i - 1, 0, doc.pages.splice(i, 1)[0]); cur = i - 1; }); } }, '↑'),
          el('button', { class: 'icon', title: 'Move down', 'aria-label': 'Move page down', disabled: i === doc.pages.length - 1, onclick: e => { e.stopPropagation(); change(() => { doc.pages.splice(i + 1, 0, doc.pages.splice(i, 1)[0]); cur = i + 1; }); } }, '↓'),
          el('button', { class: 'icon', title: 'Duplicate', 'aria-label': 'Duplicate page', onclick: e => { e.stopPropagation(); change(() => { const c = clone(pg); c.id = uid('p'); c.blocks.forEach(b => b.id = uid('b')); doc.pages.splice(i + 1, 0, c); cur = i + 1; }); } }, '⧉'),
          el('button', { class: 'icon', title: 'Delete', 'aria-label': 'Delete page', disabled: doc.pages.length < 2, onclick: e => { e.stopPropagation(); if (confirm('Delete this page?')) change(() => { doc.pages.splice(i, 1); cur = Math.max(0, i - 1); }); } }, '✕')) : null));
  }), el('button', { class: 'btn', style: 'width:100%', onclick: () => change(() => { doc.pages.splice(cur + 1, 0, { id: uid('p'), title: 'New page', blocks: [{ id: uid('b'), type: 'text', text: 'Type here.' }] }); cur++; }) }, '+ New page'));

function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

function saveTeacher() { download(slug(doc.title) + '.brightpage.html', buildFile(teacherCopy())); dirty = false; render(); toast('Saved your teacher copy.'); }

    title: el('input', { type: 'text', value: doc.title, maxlength: 120 }),

    el('label', { class: 'check' }, f.own, 'Students can add their own pages'),

    [{ label: 'Cancel' }, { label: 'Save', primary: true, onclick: () => {

    el('p', null, 'This makes a ', el('b', null, 'student copy'), '. Students can work through it, roll dice, answer, add their own pages and press SEND TO TEACHER. They cannot change your pages or tasks, and it has no AI tools.'),

      okLine(!!t.email, 'Your email: ' + t.email, 'No email: students will have no backup way to hand in.'),

function openAI() {

  const copyText = AI_RULES + '\n\nMy request: (write what you want here, e.g. "Add a 5-question quiz about…" or "Make the text simpler for B1 learners")\n\nLESSON JSON:\n```json\n' + JSON.stringify(lesson, null, 1) + '\n```';

function copy(text) {

/* ---------- keys + boot ---------- */
document.addEventListener('keydown', e => {
  if (!doc) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '');
  if (view === 'edit' && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveTeacher(); }
  if (view === 'edit' && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); doUndo(); }
  if (view !== 'edit' && !typing && !document.querySelector('.veil')) {
    if (e.key === 'ArrowRight' && cur < playerPages().length - 1) go(1);
    if (e.key === 'ArrowLeft' && cur > 0) go(-1);
    if (e.key === 'Escape' && view === 'present') { view = 'edit'; render(); }
  }
});
window.addEventListener('beforeunload', e => { if (view === 'edit' && dirty) { e.preventDefault(); e.returnValue = ''; } });
if (doc) start(doc); else render();
})();
